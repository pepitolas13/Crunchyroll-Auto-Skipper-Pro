<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crunchyroll Auto-Skipper Pro</title>
  <style>
    /* ── Reset & Base ──────────────────────────────── */
    *, *::before, *::after {
      margin: 0; padding: 0; box-sizing: border-box;
    }
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    body {
      width: 320px;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0d0d14;
      color: #e4e4ec;
      overflow: hidden;
    }

    /* ── Header ────────────────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 20px 14px;
      background: linear-gradient(135deg, #1a1a2e 0%, #16132b 100%);
      border-bottom: 1px solid rgba(255, 120, 50, 0.15);
    }
    
    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-icon {
      width: 36px; height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, #f47521 0%, #ff9a44 100%);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      box-shadow: 0 4px 15px rgba(244, 117, 33, 0.35);
      flex-shrink: 0;
    }

    .header-text h1 {
      font-size: 14px; font-weight: 700;
      background: linear-gradient(90deg, #f47521, #ffb347);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; line-height: 1.2;
    }

    .header-text p {
      font-size: 10.5px; color: #8888a4; margin-top: 2px; font-weight: 400;
      transition: opacity 0.3s ease;
    }

    /* ── Selector de Idioma (Top Right) ────────────── */
    .lang-wrapper {
      position: relative;
    }
    .lang-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 16px;
      transition: all 0.2s ease;
    }
    .lang-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(244, 117, 33, 0.3);
    }
    .lang-menu {
      position: absolute;
      top: 40px; right: 0;
      background: #1a1a2e;
      border: 1px solid rgba(255, 120, 50, 0.2);
      border-radius: 8px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
      display: flex; flex-direction: column;
      padding: 6px; gap: 4px;
      opacity: 0; pointer-events: none;
      transform: translateY(-10px);
      transition: all 0.2s ease;
      z-index: 100;
    }
    .lang-menu.show {
      opacity: 1; pointer-events: all;
      transform: translateY(0);
    }
    .lang-option {
      background: transparent; border: none; color: #e4e4ec;
      padding: 6px 12px; font-size: 12px; font-weight: 500;
      text-align: left; border-radius: 6px; cursor: pointer;
      transition: background 0.2s ease;
      font-family: inherit;
    }
    .lang-option:hover { background: rgba(244, 117, 33, 0.2); color: #fff; }
    .lang-option.active { color: #f47521; font-weight: 600; }

    /* ── Content ───────────────────────────────────── */
    .content {
      padding: 16px 20px 20px;
      display: flex; flex-direction: column; gap: 10px;
    }

    /* ── Status pill ───────────────────────────────── */
    .status-bar {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      padding: 6px 12px; margin-bottom: 4px;
      background: rgba(34, 197, 94, 0.08); border: 1px solid rgba(34, 197, 94, 0.15);
      border-radius: 8px; transition: all 0.3s ease;
    }
    .status-bar.inactive {
      background: rgba(239, 68, 68, 0.08); border-color: rgba(239, 68, 68, 0.15);
    }
    .status-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #22c55e; box-shadow: 0 0 8px rgba(34, 197, 94, 0.5);
      animation: pulse 2s infinite;
    }
    .status-bar.inactive .status-dot {
      background: #ef4444; box-shadow: 0 0 8px rgba(239, 68, 68, 0.5); animation: none;
    }
    .status-text {
      font-size: 10.5px; font-weight: 500; color: #22c55e;
      transition: opacity 0.3s ease;
    }
    .status-bar.inactive .status-text { color: #ef4444; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.4; }
    }

    /* ── Toggle Row ───────────────────────────────── */
    .toggle-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 14px; background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 12px;
      transition: background 0.25s ease, border-color 0.25s ease;
    }
    .toggle-row:hover {
      background: rgba(255, 255, 255, 0.07); border-color: rgba(244, 117, 33, 0.2);
    }
    .toggle-label { display: flex; align-items: center; gap: 10px; }
    .toggle-icon {
      width: 30px; height: 30px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; flex-shrink: 0;
    }
    .toggle-icon.recap   { background: rgba(139, 92, 246, 0.15); }
    .toggle-icon.intro   { background: rgba(244, 117, 33, 0.15); }
    .toggle-icon.next    { background: rgba(34, 197, 94, 0.15);  }
    
    .toggle-info { display: flex; flex-direction: column; }
    .toggle-name { font-size: 13px; font-weight: 600; color: #e4e4ec; line-height: 1.2; transition: opacity 0.3s ease; }
    .toggle-desc { font-size: 10px; color: #6b6b85; margin-top: 2px; line-height: 1.3; transition: opacity 0.3s ease; }

    /* ── Switch ────────────────────────────────────── */
    .switch { position: relative; width: 42px; height: 24px; flex-shrink: 0; }
    .switch input { opacity: 0; width: 0; height: 0; position: absolute; }
    .slider {
      position: absolute; inset: 0; background: #2a2a3e;
      border-radius: 24px; cursor: pointer; transition: 0.3s ease;
    }
    .slider::before {
      content: ''; position: absolute; height: 18px; width: 18px; left: 3px; bottom: 3px;
      background: #6b6b85; border-radius: 50%; transition: 0.3s ease;
    }
    .switch input:checked + .slider { background: linear-gradient(135deg, #f47521, #ff9a44); box-shadow: 0 2px 12px rgba(244, 117, 33, 0.35); }
    .switch input:checked + .slider::before { transform: translateX(18px); background: #fff; box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3); }

    /* ── Footer ────────────────────────────────────── */
    .footer {
      padding: 12px 20px;
      text-align: center;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      display: flex; flex-direction: column; gap: 8px;
    }
    
    .social-links {
      display: flex; justify-content: center; gap: 12px;
    }
    
    .social-btn {
      color: #8888a4; text-decoration: none;
      display: flex; align-items: center; justify-content: center;
      width: 28px; height: 28px; border-radius: 6px;
      background: rgba(255, 255, 255, 0.03);
      transition: all 0.2s ease;
    }
    .social-btn svg { width: 16px; height: 16px; fill: currentColor; }
    .social-btn:hover { color: #f47521; background: rgba(244, 117, 33, 0.1); transform: translateY(-2px); }
    .social-btn.donate:hover { color: #ff5e5e; background: rgba(255, 94, 94, 0.1); }

    .footer p { font-size: 9.5px; color: #4a4a62; letter-spacing: 0.3px; transition: opacity 0.3s ease; }
    .footer .version { color: #f47521; font-weight: 600; }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <div class="header-icon">⚡</div>
      <div class="header-text">
        <h1>Auto-Skipper Pro</h1>
        <p data-i18n="appDesc">Crunchyroll · Salto automático</p>
      </div>
    </div>
    
    <!-- Language Selector -->
    <div class="lang-wrapper">
      <button class="lang-btn" id="langBtn" aria-label="Change Language">🌐</button>
      <div class="lang-menu" id="langMenu">
        <button class="lang-option" data-lang="en">EN · English</button>
        <button class="lang-option" data-lang="es">ES · Español</button>
        <button class="lang-option" data-lang="ca">CA · Català</button>
        <button class="lang-option" data-lang="fr">FR · Français</button>
        <button class="lang-option" data-lang="de">DE · Deutsch</button>
        <button class="lang-option" data-lang="it">IT · Italiano</button>
      </div>
    </div>
  </div>

  <!-- Content -->
  <div class="content">
    <!-- Status bar -->
    <div class="status-bar" id="statusBar">
      <div class="status-dot"></div>
      <span class="status-text" id="statusText" data-i18n="statusActive">Activo · Monitoreando</span>
    </div>

    <!-- Toggle: Recap -->
    <div class="toggle-row">
      <div class="toggle-label">
        <div class="toggle-icon recap">📋</div>
        <div class="toggle-info">
          <span class="toggle-name" data-i18n="recapTitle">Saltar Resumen</span>
          <span class="toggle-desc" data-i18n="recapDesc">Salta el recap del episodio anterior</span>
        </div>
      </div>
      <label class="switch">
        <input type="checkbox" id="toggleRecap" checked>
        <span class="slider"></span>
      </label>
    </div>

    <!-- Toggle: Intro -->
    <div class="toggle-row">
      <div class="toggle-label">
        <div class="toggle-icon intro">🎵</div>
        <div class="toggle-info">
          <span class="toggle-name" data-i18n="introTitle">Saltar Intro</span>
          <span class="toggle-desc" data-i18n="introDesc">Salta la secuencia de apertura</span>
        </div>
      </div>
      <label class="switch">
        <input type="checkbox" id="toggleIntro" checked>
        <span class="slider"></span>
      </label>
    </div>

    <!-- Toggle: Credits -->
    <div class="toggle-row">
      <div class="toggle-label">
        <div class="toggle-icon next">⏭️</div>
        <div class="toggle-info">
          <span class="toggle-name" data-i18n="creditsTitle">Saltar Créditos</span>
          <span class="toggle-desc" data-i18n="creditsDesc">Salta créditos finales automáticamente</span>
        </div>
      </div>
      <label class="switch">
        <input type="checkbox" id="toggleCredits" checked>
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <!-- Footer with Socials -->
  <div class="footer">
    <div class="social-links">
      <a href="https://youtube.com/" target="_blank" class="social-btn" title="YouTube">
        <svg viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
      </a>
      <a href="https://github.com/" target="_blank" class="social-btn" title="GitHub">

      </a>
      <a href="#" target="_blank" class="social-btn" title="Website">
        <svg viewBox="0 0 24 24"><path d="M12 0a12 12 0 1 0 12 12A12.013 12.013 0 0 0 12 0zm6.81 7.2h-3.66a15.7 15.7 0 0 0-1.3-4.14 9.61 9.61 0 0 1 4.96 4.14zm-9.08-4.14a15.7 15.7 0 0 0-1.3 4.14H4.77A9.61 9.61 0 0 1 9.73 3.06zM2.87 9.6h4.1a22.38 22.38 0 0 0 0 4.8H2.87a9.68 9.68 0 0 1 0-4.8zm1.9 7.2h3.66a15.7 15.7 0 0 0 1.3 4.14 9.61 9.61 0 0 1-4.96-4.14zm4.96 4.14a15.7 15.7 0 0 0 1.3-4.14h4.54a15.7 15.7 0 0 0 1.3 4.14zm5.84-6.54H8.43a20.08 20.08 0 0 1 0-4.8h7.14a20.08 20.08 0 0 1 0 4.8zm-1.3 6.54a15.7 15.7 0 0 0 1.3-4.14h3.66a9.61 9.61 0 0 1-4.96 4.14zm2.76-6.54a22.38 22.38 0 0 0 0-4.8h4.1a9.68 9.68 0 0 1 0 4.8z"/></svg>

      <a href="https://ko-fi.com/" target="_blank" class="social-btn donate" title="Donate / Ko-fi">

      </a>
    </div>
    <p data-i18n="versionText">Crunchyroll Auto-Skipper Pro · v1.0.0</p>
  </div>

  <script src="popup.js"></script>
</body>
</html>
